services:
  postgres:
    image: postgres:18.6-alpine
    command: -c 'max_connections=200'
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=projektordb
      - TZ=UTC
    ports:
      - "5433:5432"
  objectstorage:
    image: rustfs/rustfs:1.0.0-rc.6
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: minio_access_key
      RUSTFS_SECRET_KEY: minio_secret_key

volumes:
  rustfs-data:

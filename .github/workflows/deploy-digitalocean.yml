name: Deploy to DigitalOcean

# Builds the server Docker image, pushes it to DigitalOcean Container Registry, then deploys it.
# The App Platform app's service pulls `projektor:latest` from DOCR (its source is the image, not
# the GitHub repo), so App Platform itself never builds from source.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

env:
  IMAGE: registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/projektor

jobs:
  deploy-app:
    name: Deploy app
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1800
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            honeycomb_api_key=${{ secrets.HONEYCOMB_API_KEY }}
            cache_access_key=${{ secrets.CACHE_ACCESS_KEY }}
            cache_secret_key=${{ secrets.CACHE_SECRET_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy the app
        run: doctl apps create-deployment ${{ vars.DIGITALOCEAN_APP_ID }} --wait

name: Deploy to DigitalOcean

# Builds the server Docker image, pushes it to GitHub Container Registry, then deploys it.
# The App Platform app's service pulls the public `ghcr.io/craigatk/projektor:latest` image (its
# source is the image, not the GitHub repo), so App Platform itself never builds from source.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy-app:
    name: Deploy app
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            honeycomb_api_key=${{ secrets.HONEYCOMB_API_KEY }}
            cache_access_key=${{ secrets.CACHE_ACCESS_KEY }}
            cache_secret_key=${{ secrets.CACHE_SECRET_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy the app
        run: doctl apps create-deployment ${{ vars.DIGITALOCEAN_APP_ID }} --wait
